[package]
name = "remarkable-calendar-core"
version = "0.8.0"
edition = "2021"
description = "reMarkable Calendar — a native calendar app for reMarkable tablets"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono-tz = "0.10"
